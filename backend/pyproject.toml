[project]
name = "alibi-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi[standard]", "uvicorn", "sqlalchemy[asyncio]", "aiosqlite", "pydantic>=2", "pydantic-settings", "anthropic>=1.7", "python-dotenv", "websockets"]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "httpx", "ruff"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: needs a real Anthropic credential"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py311"
